<style>
  :root {
    --ungu-terang: #8B5CF6;
    --ungu: #6D28D9;
    --ungu-gelap: #2E1065;
    --emas: #FBBF24;
    --kartu: rgba(255,255,255,.08);
    --kartu-garis: rgba(255,255,255,.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(120% 60% at 50% 0%, var(--ungu-terang), transparent),
                linear-gradient(160deg, var(--ungu) 0%, var(--ungu-gelap) 70%);
    background-color: var(--ungu-gelap);
    color: #fff;
  }
  body { min-height: 100dvh; display: flex; justify-content: center; }
  main {
    width: 100%; max-width: 440px;
    padding: calc(40px + env(safe-area-inset-top, 0px)) 20px calc(28px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center;
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 8px; }
  .brand img { width: min(190px, 52vw); height: auto; display: block; }
  .brand p { margin: 0; font-size: 13px; letter-spacing: .4px; color: rgba(255,255,255,.72); text-align: center; }

  .links { width: 100%; margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    width: 100%; padding: 15px 18px;
    background: var(--kartu); border: 1px solid var(--kartu-garis);
    border-radius: 16px; color: #fff; text-decoration: none;
    backdrop-filter: blur(6px);
    transition: transform .12s ease, background .12s ease;
  }
  .link:active { transform: scale(.98); background: rgba(255,255,255,.14); }
  .link .ic {
    flex: 0 0 auto; width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #A78BFA, #6D28D9);
  }
  .link .ic svg { width: 22px; height: 22px; }
  .link .txt { flex: 1; min-width: 0; }
  .link .txt b { display: block; font-size: 15px; font-weight: 700; line-height: 1.3; }
  .link .txt span { display: block; font-size: 12.5px; color: rgba(255,255,255,.62); margin-top: 1px; }
  .link .go { flex: 0 0 auto; opacity: .5; }
  .link .go svg { width: 18px; height: 18px; }

  .sosial { display: flex; gap: 12px; margin-top: 4px; }
  .sosial .link { flex: 1; flex-direction: column; text-align: center; gap: 8px; padding: 16px 10px; }
  .sosial .link .txt b { font-size: 13.5px; }
  .sosial .link .txt span { font-size: 11.5px; }

  .cadangan {
    margin-top: 34px; display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: rgba(255,255,255,.5); text-decoration: none;
    padding: 6px 12px; border-radius: 999px;
  }
  .cadangan:active { background: rgba(255,255,255,.08); }
  .cadangan .av {
    width: 22px; height: 22px; border-radius: 50%; overflow: hidden; flex: 0 0 auto;
    background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center;
  }
  .cadangan .av svg { width: 13px; height: 13px; opacity: .8; }

  footer { margin-top: 18px; font-size: 11px; color: rgba(255,255,255,.35); text-align: center; }
</style>
</head>
